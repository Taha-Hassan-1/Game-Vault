services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Passw0rd"
    ports: ["1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Your_strong_Passw0rd -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10

  web:
    build: .
    depends_on:
      sql:
        condition: service_healthy
    environment:
      ConnectionStrings__GameVault: "Server=sql;Database=GameVault;User Id=sa;Password=Your_strong_Passw0rd;TrustServerCertificate=True"
      Database__MigrateOnStart: "true"
    ports: ["8080:8080"]
